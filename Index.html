  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Reddit Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7acb2928-73c0-4e98-a0b3-8a79c915825f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Reddit Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ec51f3a5-979b-446c-bdb0-d5083ebebdb3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* ─── Holcim brand tokens ──────────────────────────────────────────── */\n  :root {\n    --navy: #041739;\n    --cyan: #05b7ed;\n    --lime: #65c12a;\n    --slate: #3d5070;\n    --amber: #b45309;\n    --green: #65c12a;\n    --red: #b91c1c;\n    --light: #f4f6fa;\n    --ink: #1f2937;\n    --ink-soft: #374151;\n    --ink-mute: #4b5563;\n    --line: #e5e7eb;\n  }\n\n  /* ─── Base ────────────────────────────────────────────────────────── */\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; scroll-padding-top: 70px; }\n  body {\n    margin: 0;\n    font-family: 'Reddit Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;\n    background: #f5f6f8;\n    color: var(--ink);\n    line-height: 1.5;\n  }\n  a { color: inherit; }\n  h1, h2, h3 { margin: 0; }\n  button { font-family: inherit; }\n\n  /* ─── Sticky nav ──────────────────────────────────────────────────── */\n  .nav {\n    position: sticky; top: 0; z-index: 50;\n    background: var(--navy);\n    display: flex; align-items: center;\n    padding: 0 24px; height: 52; /* fallback */\n    height: 52px; gap: 4px;\n    box-shadow: 0 2px 12px rgba(0,0,0,0.2);\n    overflow-x: auto;\n  }\n  .nav__brand {\n    display: flex; align-items: center; gap: 10px;\n    margin-right: 20px; flex-shrink: 0;\n  }\n  .nav__logo-img {\n    height: 22px; width: auto;\n    display: block;\n    filter: brightness(0) invert(1);\n  }\n  .nav__logo {\n    font-family: 'Reddit Sans', sans-serif;\n    font-weight: 700;\n    font-size: 16px;\n    letter-spacing: 0.08em;\n    color: #fff;\n  }\n  .nav__divider {\n    font-size: 13px;\n    font-weight: 600;\n    color: rgba(255,255,255,0.6);\n    border-left: 1px solid rgba(255,255,255,0.2);\n    padding-left: 10px;\n  }\n  .nav__link {\n    padding: 8px 14px; border-radius: 6px;\n    text-decoration: none;\n    font-size: 13px; font-weight: 500; white-space: nowrap;\n    color: rgba(255,255,255,0.65);\n    background: transparent;\n    transition: all 0.15s;\n  }\n  .nav__link:hover { color: #fff; background: rgba(255,255,255,0.06); }\n  .nav__link.is-active { color: #fff; background: rgba(255,255,255,0.1); }\n\n  /* ─── Hero ────────────────────────────────────────────────────────── */\n  .hero {\n    background: var(--navy); color: #fff;\n    padding: 70px 40px 80px;\n  }\n  .hero__inner { max-width: 980px; margin: 0 auto; }\n  .hero__eyebrow {\n    font-size: 12px; font-weight: 700;\n    letter-spacing: 0.15em; text-transform: uppercase;\n    color: var(--cyan);\n    margin-bottom: 16px;\n  }\n  .hero__title {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 64px; font-weight: 800;\n    letter-spacing: -0.015em; line-height: 1.0;\n    text-transform: uppercase;\n    margin: 0 0 24px;\n  }\n  .hero__sub {\n    font-size: 17px; color: rgba(255,255,255,0.7);\n    line-height: 1.6; max-width: 580px; margin: 0;\n  }\n\n  /* ─── Signature stroke ────────────────────────────────────────────── */\n  .stroke {\n    display: inline-block;\n    position: relative;\n  }\n  .stroke::before {\n    content: '';\n    position: absolute;\n    left: -11px; right: -11px;\n    bottom: 3px;\n    height: 14px;\n    background: linear-gradient(90deg, #65c12a 0%, #05b7ed 50%, #164375 100%);\n    z-index: 0;\n  }\n  .stroke > span {\n    position: relative;\n    z-index: 1;\n  }\n  .hero__title .stroke::before {\n    bottom: 4px;\n    height: 14px;\n  }\n  .signoff .stroke::before {\n    bottom: 4px;\n    height: 16px;\n  }\n\n  /* ─── Sign-off footer ─────────────────────────────────────────────── */\n  .signoff {\n    background: var(--navy); color: #fff;\n    padding: 90px 40px 60px;\n  }\n  .signoff__inner { max-width: 1000px; margin: 0 auto; }\n  .signoff__title {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 72px; font-weight: 800;\n    letter-spacing: -0.02em; line-height: 0.95;\n    text-transform: uppercase;\n    margin: 0;\n  }\n  .signoff__stroke-w { display: inline-block; position: relative; }\n  .signoff__stroke-w::before {\n    content: '';\n    position: absolute;\n    left: -12px; right: -12px;\n    bottom: 3px;\n    height: 16px;\n    background: linear-gradient(90deg, #65c12a 0%, #05b7ed 50%, #164375 100%);\n    z-index: 0;\n  }\n  .signoff__stroke-w > span { position: relative; z-index: 1; }\n  .signoff__sub {\n    margin-top: 40px;\n    font-size: 16px; font-weight: 700;\n    letter-spacing: 0.08em; text-transform: uppercase;\n    color: var(--cyan); max-width: 700px;\n  }\n  .signoff__foot {\n    margin-top: 80px;\n    display: flex; align-items: flex-end; justify-content: space-between;\n    flex-wrap: wrap; gap: 20px;\n  }\n  .signoff__mark {\n    font-size: 12px; color: rgba(255,255,255,0.4);\n    letter-spacing: 0.08em; text-transform: uppercase;\n  }\n  .signoff__logo {\n    height: 32px;\n    filter: brightness(0) invert(1);\n  }\n\n  /* ─── Layout ──────────────────────────────────────────────────────── */\n  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }\n\n  .section {\n    background: #fff;\n    border-radius: 16px;\n    padding: 40px;\n    margin-bottom: 24px;\n    box-shadow: 0 1px 4px rgba(0,0,0,0.06);\n  }\n\n  .section-title { margin-bottom: 28px; }\n  .section-title__label {\n    font-size: 11px; font-weight: 700;\n    letter-spacing: 0.1em; text-transform: uppercase;\n    color: var(--navy);\n    margin-bottom: 6px;\n  }\n  .section-title__title {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 26px; font-weight: 800;\n    color: var(--navy);\n    letter-spacing: -0.005em; line-height: 1.2;\n    text-transform: uppercase;\n  }\n\n  .prose { font-size: 15.5px; line-height: 1.8; color: var(--ink-soft); }\n  .prose--sm { font-size: 15px; line-height: 1.75; }\n  .prose + .prose, .prose + * { margin-top: 20px; }\n\n  /* ─── Callouts / tints ────────────────────────────────────────────── */\n  .callout {\n    border-radius: 12px; padding: 22px 26px;\n    border-left: 4px solid var(--navy);\n    background: rgba(4, 23, 57, 0.05);\n    font-size: 15.5px; line-height: 1.85; color: var(--ink);\n  }\n  .callout--slate {\n    background: var(--light);\n    border-left-color: var(--navy);\n  }\n\n  .warn {\n    background: #fff7ed;\n    border: 2px solid var(--amber);\n    border-radius: 12px;\n    padding: 22px 26px;\n    margin-bottom: 28px;\n    display: flex; gap: 12px; align-items: flex-start;\n  }\n  .warn__icon { font-size: 22px; line-height: 1; }\n  .warn__title {\n    font-size: 15px; font-weight: 700;\n    color: var(--amber); margin-bottom: 8px; letter-spacing: 0.02em;\n  }\n  .warn__body { font-size: 14.5px; line-height: 1.7; color: #5a3410; }\n\n  /* ─── Grids ───────────────────────────────────────────────────────── */\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n  .grid-2--tight { gap: 12px; }\n  .grid-2--small { gap: 16px; }\n  @media (max-width: 720px) {\n    .grid-2, .grid-2--tight, .grid-2--small { grid-template-columns: 1fr; }\n  }\n\n  /* ─── Welcome tiles ───────────────────────────────────────────────── */\n  .tile {\n    border-radius: 10px;\n    padding: 20px;\n    border: 1px solid;\n  }\n  .tile--good { background: rgba(95,138,31,0.05); border-color: rgba(95,138,31,0.2); }\n  .tile--bad { background: #fef2f2; border-color: #fecaca; }\n  .tile__header {\n    font-size: 12px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.07em;\n    margin-bottom: 10px;\n  }\n  .tile--good .tile__header { color: var(--green); }\n  .tile--bad .tile__header { color: var(--red); }\n  .tile__item {\n    display: flex; gap: 8px; margin-bottom: 8px;\n    font-size: 13.5px; line-height: 1.5;\n  }\n  .tile--good .tile__item { color: #065f46; }\n  .tile--bad .tile__item { color: #991b1b; }\n  .tile__check { color: var(--green); flex-shrink: 0; }\n  .tile__cross { color: var(--red); flex-shrink: 0; }\n\n  /* ─── Form sections (walkthrough) ─────────────────────────────────── */\n  .form-card {\n    background: var(--light);\n    border-radius: 10px; padding: 16px 18px;\n    border: 1px solid var(--line);\n  }\n  .form-card__head {\n    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\n  }\n  .form-card__num {\n    width: 22px; height: 22px; border-radius: 50%;\n    background: var(--cyan); color: #fff;\n    display: flex; align-items: center; justify-content: center;\n    font-weight: 700; font-size: 11px;\n  }\n  .form-card__title {\n    font-size: 14px; font-weight: 700;\n    color: var(--navy); line-height: 1.3;\n  }\n  .form-card__body {\n    font-size: 13.5px; line-height: 1.6; color: var(--ink-mute);\n  }\n\n  /* ─── Tips block ──────────────────────────────────────────────────── */\n  .tip {\n    background: var(--light); border: 1px solid var(--line);\n    border-radius: 10px; padding: 20px 22px;\n    margin-bottom: 14px;\n  }\n  .tip__head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }\n  .tip__num {\n    width: 28px; height: 28px; border-radius: 50%;\n    background: var(--navy); color: #fff;\n    display: flex; align-items: center; justify-content: center;\n    font-weight: 700; font-size: 14px;\n  }\n  .tip__title { font-size: 16px; font-weight: 700; color: var(--navy); }\n  .tip__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  @media (max-width: 720px) { .tip__grid { grid-template-columns: 1fr; } }\n  .tip__good, .tip__bad {\n    border-radius: 8px; padding: 12px 14px;\n    font-size: 13.5px; line-height: 1.6; font-style: italic;\n  }\n  .tip__good {\n    background: rgba(95,138,31,0.05);\n    border-left: 3px solid var(--green);\n    color: #065f46;\n  }\n  .tip__bad {\n    background: #fef2f2;\n    border-left: 3px solid var(--red);\n    color: #991b1b;\n  }\n  .tip__label {\n    font-size: 11px; font-weight: 700;\n    letter-spacing: 0.05em; text-transform: uppercase;\n    margin-bottom: 6px; font-style: normal;\n  }\n  .tip__good .tip__label { color: var(--green); }\n  .tip__bad .tip__label { color: var(--red); }\n\n  /* ─── Example toggle ──────────────────────────────────────────────── */\n  .ex-toggle { display: flex; gap: 8px; margin-bottom: 20px; }\n  .ex-toggle__btn {\n    padding: 10px 20px; border-radius: 8px;\n    border: none; cursor: pointer;\n    background: #f0f2f5; color: var(--slate);\n    font-weight: 600; font-size: 14px;\n    transition: all 0.15s;\n  }\n  .ex-toggle__btn:hover { background: #e5e7eb; }\n  .ex-toggle__btn.is-active { color: #fff; }\n  .ex-toggle__btn[data-kind=\"good\"].is-active { background: var(--green); }\n  .ex-toggle__btn[data-kind=\"bad\"].is-active { background: var(--red); }\n\n  .ex-item { margin-bottom: 18px; }\n  .ex-item__q-label {\n    font-size: 12px; font-weight: 700;\n    letter-spacing: 0.05em; text-transform: uppercase;\n    margin-bottom: 6px;\n  }\n  .ex-item__q {\n    font-size: 14px; font-weight: 600;\n    color: var(--navy); margin-bottom: 8px;\n  }\n  .ex-item__a {\n    font-size: 14px; line-height: 1.7; color: var(--ink-soft);\n    background: var(--light); padding: 14px 16px; border-radius: 8px;\n  }\n\n  /* ─── Timeline ────────────────────────────────────────────────────── */\n  .timeline { display: flex; flex-direction: column; gap: 12px; }\n  .tl-row {\n    display: grid; grid-template-columns: 160px 20px 1fr;\n    align-items: center; gap: 18px;\n    background: var(--light);\n    padding: 14px 18px; border-radius: 8px;\n  }\n  .tl-row.tl--you { background: rgba(4,23,57,0.05); }\n  .tl-row__when { font-size: 13px; font-weight: 700; color: var(--slate); }\n  .tl--you .tl-row__when { color: var(--navy); }\n  .tl-row__dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }\n  .tl--you .tl-row__dot { background: var(--navy); }\n  .tl-row__what { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; }\n  .tl-row__pill {\n    margin-left: 10px; font-size: 11px; font-weight: 700;\n    color: var(--navy); background: rgba(4,23,57,0.09);\n    padding: 2px 8px; border-radius: 99px;\n    letter-spacing: 0.05em; text-transform: uppercase;\n  }\n  @media (max-width: 600px) {\n    .tl-row { grid-template-columns: 1fr; gap: 6px; }\n    .tl-row__dot { display: none; }\n  }\n\n  /* ─── Payback tiles ───────────────────────────────────────────────── */\n  .pay-tile {\n    background: var(--light); border: 1px solid var(--line);\n    border-radius: 10px; padding: 20px 22px;\n  }\n  .pay-tile__label {\n    font-size: 12px; font-weight: 700;\n    color: var(--navy); letter-spacing: 0.07em;\n    text-transform: uppercase; margin-bottom: 8px;\n  }\n  .pay-tile__body { font-size: 14px; line-height: 1.7; color: var(--ink-soft); }\n\n  .pay-footnote {\n    margin-top: 22px;\n    font-size: 14px; line-height: 1.7; color: #6b7280;\n  }\n\n  /* ─── FAQ accordion ───────────────────────────────────────────────── */\n  .faqs { display: flex; flex-direction: column; gap: 10px; }\n  .faq {\n    background: #fff; border: 1px solid var(--line);\n    border-radius: 10px; overflow: hidden;\n  }\n  .faq__btn {\n    width: 100%; text-align: left;\n    padding: 18px 20px;\n    display: flex; justify-content: space-between; align-items: center;\n    background: none; border: none; cursor: pointer;\n    gap: 16px;\n  }\n  .faq__row { display: flex; gap: 12px; align-items: flex-start; }\n  .faq__q {\n    font-size: 14.5px; font-weight: 600;\n    color: var(--navy); line-height: 1.5; text-align: left;\n  }\n  .faq__pill {\n    display: inline-block; padding: 2px 10px; border-radius: 99px;\n    font-size: 11px; font-weight: 700;\n    letter-spacing: 0.05em; text-transform: uppercase;\n    flex-shrink: 0;\n  }\n  .pill--Common { background: rgba(4,23,57,0.09); color: var(--navy); border: 1px solid rgba(4,23,57,0.27); }\n  .pill--Scope { background: rgba(61,80,112,0.09); color: var(--slate); border: 1px solid rgba(61,80,112,0.27); }\n  .pill--Trust { background: rgba(180,83,9,0.09); color: var(--amber); border: 1px solid rgba(180,83,9,0.27); }\n  .pill--Data { background: rgba(5,183,237,0.09); color: var(--cyan); border: 1px solid rgba(5,183,237,0.27); }\n\n  .faq__plus {\n    font-size: 20px; color: #9ca3af; flex-shrink: 0;\n    transition: transform 0.2s;\n  }\n  .faq.is-open .faq__plus { transform: rotate(45deg); }\n\n  .faq__a {\n    display: none;\n    padding: 0 20px 20px 20px;\n    font-size: 14px; line-height: 1.75; color: var(--ink-soft);\n  }\n  .faq.is-open .faq__a { display: block; }\n\n  /* ─── Footer ──────────────────────────────────────────────────────── */\n  .foot {\n    text-align: center; padding: 24px 0 8px;\n    font-size: 13px; color: #9ca3af;\n  }\n\n  @media (max-width: 640px) {\n    .section { padding: 28px 22px; }\n    .hero__title { font-size: 32px; }\n    .section-title__title { font-size: 22px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<nav class=\"nav\" id=\"topnav\">\n  <div class=\"nav__brand\">\n    <img class=\"nav__logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABFCAYAAADw8dtTAAAPVElEQVR4AeydCb \n    <h1 class=\"hero__title\">\n      Let's talk<br>\n      about your<br>\n      <span class=\"stroke\"><span>Career<\u002Fspan><\u002Fspan>\n    <\u002Fh1>\n    <p class=\"hero__sub\">A more intentional conversation about where you are, what you want, and what would help. Whether that's a move, a stretch, or staying right where you are.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main class=\"wrap\">\n\n  <!-- Welcome -->\n  <section class=\"section\" id=\"welcome\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">Start Here<\u002Fdiv>\n      <h2 class=\"section-title__title\">What this is really about<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"prose\">We’re taking a more intentional look at the careers of colleagues across the business - and we want to hear from you. The form you’ll receive is a chance to share your future ambitions, your development areas, and your career goals in your own words.<\u002Fp>\n    <div class=\"callout\" style=\"margin-bottom:20px\">\n      Wanting to stay in the same role or move laterally is more than okay. This isn’t a process built just for people chasing multi-layer promotions. It’s for everyone in scope - whatever your ambition looks like. We just want to make sure we hear from you.\n    <\u002Fdiv>\n    <div class=\"grid-2\">\n      <div class=\"tile tile--good\">\n        <div class=\"tile__header\">What this is<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__check\">✓<\u002Fspan>A chance to share your career aspirations in your own words<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__check\">✓<\u002Fspan>A space to name your development areas and what would help<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__check\">✓<\u002Fspan>A conversation starter with your manager - not a test<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__check\">✓<\u002Fspan>For everyone in scope, whether you want a move, a stretch or to stay<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tile tile--bad\">\n        <div class=\"tile__header\">What it isn’t<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__cross\">✗<\u002Fspan>A performance review<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__cross\">✗<\u002Fspan>A decision about your pay or your next promotion<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__cross\">✗<\u002Fspan>A test you pass or fail<\u002Fdiv>\n        <div class=\"tile__item\"><span class=\"tile__cross\">✗<\u002Fspan>A process only for people who want promotion<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Why you -->\n  <section class=\"section\" id=\"why-you\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">Why You<\u002Fdiv>\n      <h2 class=\"section-title__title\">Why you’ve been asked - and why some of your peers haven’t<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\">You may notice that not everyone in your team or function is being reviewed this cycle. We want to be honest with you about why.<\u002Fp>\n    <div class=\"callout callout--slate\" style=\"margin-bottom:20px\">\n      Scope is defined by <strong>role<\u002Fstrong>, not by person. We know how important career growth into P&amp;L is for this business - so we’re starting the development and career conversations with colleagues in P&amp;L roles and in feeder roles that lead into P&amp;L positions. The review will roll out to other roles over time.\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\" style=\"color:var(--ink-mute)\">Being in scope reflects the role you’re in today - not a judgement on colleagues who aren’t. And being out of scope this cycle doesn’t mean being overlooked. If you want to understand why your role specifically is in scope, your line manager can explain that directly.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- The form -->\n  <section class=\"section\" id=\"form\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">The Form<\u002Fdiv>\n      <h2 class=\"section-title__title\">What you’ll be asked - and a crucial note on sharing<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"warn\">\n      <div class=\"warn__icon\">⚠<\u002Fdiv>\n      <div>\n        <div class=\"warn__title\">Please do not copy, share or forward this form<\u002Fdiv>\n        <div class=\"warn__body\">Your form is personal to you. It will be pre-populated with your <strong>name<\u002Fstrong> and <strong>employee ID<\u002Fstrong>, and we use it to give your manager an accurate view of your aspirations and development priorities. Copies floating around - edited, re-shared or template-swapped - break that link and make the process unreliable for everyone. Please complete your own form only, and submit it back through the official route.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\">The form is broken into a few sections. Here’s what you’ll see, and what each part is really asking:<\u002Fp>\n    <div class=\"grid-2 grid-2--tight\" id=\"form-sections\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- How to fill it in -->\n  <section class=\"section\" id=\"howto\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">How to Fill It In<\u002Fdiv>\n      <h2 class=\"section-title__title\">Four tips for a strong self-assessment<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\">The form should take about 30–45 minutes if you’ve thought about it first. The quality of your inputs shapes the quality of the conversation you’ll have with your manager - so it’s worth doing well.<\u002Fp>\n    <div id=\"tips\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Example -->\n  <section class=\"section\" id=\"example\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\" style=\"color:var(--cyan)\">Worked Example<\u002Fdiv>\n      <h2 class=\"section-title__title\">A strong vs. weaker self-assessment - side by side<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\">Same questions, very different answers. Flip between them to see what separates a strong submission from a weaker one - the difference is specificity, not word count.<\u002Fp>\n    <div class=\"ex-toggle\">\n      <button class=\"ex-toggle__btn is-active\" data-kind=\"good\" id=\"ex-btn-good\">Strong example<\u002Fbutton>\n      <button class=\"ex-toggle__btn\" data-kind=\"bad\" id=\"ex-btn-bad\">Weaker example<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"example-items\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- After you submit -->\n  <section class=\"section\" id=\"after\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">What Happens Next<\u002Fdiv>\n      <h2 class=\"section-title__title\">After you submit<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"timeline\" id=\"timeline\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Payback -->\n  <section class=\"section\" id=\"payback\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\">What comes back to you<\u002Fdiv>\n      <h2 class=\"section-title__title\">What you can expect from this<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"prose prose--sm\">We want to be honest - this isn’t a process where filling in a form unlocks a promotion or a move. What it does do is put your career properly on the table, so the right people are thinking about it.<\u002Fp>\n    <div class=\"grid-2 grid-2--small\">\n      <div class=\"pay-tile\">\n        <div class=\"pay-tile__label\">A proper conversation<\u002Fdiv>\n        <div class=\"pay-tile__body\">Your manager will sit down with you for a dedicated development conversation informed by what you’ve shared - not a generic catch-up.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pay-tile\">\n        <div class=\"pay-tile__label\">Your aspirations on the record<\u002Fdiv>\n        <div class=\"pay-tile__body\">Where you want to go - and what would help - is captured and visible when moves, stretch assignments and development opportunities come up.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pay-footnote\">\n      We can’t promise a specific outcome, and we won’t pretend to. What we can say is that development actions agreed after this process are reviewed regularly at a senior level - so there’s ownership to follow through on what’s committed.\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section class=\"section\" id=\"faq\">\n    <div class=\"section-title\">\n      <div class=\"section-title__label\" style=\"color:var(--amber)\">Your Questions<\u002Fdiv>\n      <h2 class=\"section-title__title\">FAQ - straight answers<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faqs\" id=\"faqs\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"foot\">Talent Review - Colleague Guide<\u002Fdiv>\n<\u002Fmain>\n\n<section class=\"signoff\">\n  <div class=\"signoff__inner\">\n    <h2 class=\"signoff__title\">\n      Your <span class=\"signoff__stroke-w\"><span>Career<\u002Fspan><\u002Fspan>.<br>\n      Your voice.\n    <\u002Fh2>\n    <div class=\"signoff__sub\">Tell us where you want to go. We're listening.<\u002Fdiv>\n    <div class=\"signoff__foot\">\n      <div class=\"signoff__mark\">Holcim People &amp; Culture · People Review 2026<\u002Fdiv>\n      <img class=\"signoff__logo\" src=\"85a673d9-7028-43d5-a9c2-41b288cd34ba\" alt=\"Holcim\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<script>\n  // ─── Data ──────────────────────────────────────────────────────────\n  const TIPS = [\n    { title: \"Be specific - not general\",              good: \"\\\"I led the quarterly planning session when my manager was on leave, aligning three functions on priorities.\\\"\", bad: \"\\\"I\\u2019m a strong leader and people look to me.\\\"\" },\n    { title: \"Name what you want - don\\u2019t hint at it\", good: \"\\\"In the next 2\\u20133 years I\\u2019d like to move into a role with broader regional scope, ideally with P&L responsibility.\\\"\", bad: \"\\\"I\\u2019m open to whatever the business needs.\\\"\" },\n    { title: \"Be realistic about mobility\",             good: \"\\\"I can realistically cover UK, Ireland and Benelux. I can\\u2019t relocate internationally for the next 2 years.\\\"\", bad: \"\\\"I\\u2019m flexible on location.\\\"\" },\n    { title: \"Own your development priorities\",         good: \"\\\"P&L exposure end to end \\u2014 I\\u2019ve led operations but never owned the full P&L.\\\"\", bad: \"\\\"Keep developing my leadership.\\\"\" }\n  ];\n\n  const FORM_SECTIONS = [\n    { title: \"Basics and current role\",              body: \"Your name, employee ID, band, tenure, role, business unit and location \\u2014 most of this is already pre-populated. Just check it\\u2019s right.\" },\n    { title: \"Mobility\",                             body: \"Current working region, regional mobility, global mobility. Be realistic \\u2014 not aspirational. If you can\\u2019t move internationally right now, say so. This isn\\u2019t a test of ambition.\" },\n    { title: \"Preferred future career direction\",    body: \"Where you\\u2019d like to head over the next few years \\u2014 not just your immediate next role. Lateral, deeper or up are all valid answers.\" },\n    { title: \"Experience overview to date\",          body: \"Your career so far \\u2014 companies, roles, team size, operational scale (volumes), commercial responsibility (EBIT/revenue). Gives context on the ground you\\u2019ve covered.\" },\n    { title: \"Standout achievements\",                body: \"50 words max each. One specific achievement with a clear outcome beats five vague claims.\" },\n    { title: \"Key development priorities\",           body: \"Up to four priorities, 50 words each. The experiences or skills you want to build. Concrete beats abstract.\" },\n    { title: \"Career aspirations\",                   body: \"Up to 200 words on what you actually want. Your words, your voice \\u2014 not a career ladder template.\" },\n    { title: \"Qualifications & performance trajectory\", body: \"Professional and academic qualifications, plus your last 3 performance ratings (pre-populated).\" }\n  ];\n\n  const EXAMPLE_GOOD = [\n    { q: \"Preferred future career direction\",         a: \"Over the next 3\\u20135 years I\\u2019d like to broaden into a regional commercial role with P&L responsibility \\u2014 moving from operations into a general management track. I want scope that stretches me on complexity, not just scale.\" },\n    { q: \"Standout achievement (50 words max)\",       a: \"Landed a mid-year price increase across the key accounts portfolio during a period of volatile energy and haulage costs. Held volumes with all top 10 customers, protected margin on repeat business, and rebuilt the commercial narrative with the sales team so the rationale held through tough negotiations. (46 words)\" },\n    { q: \"Key development priority (50 words max)\",   a: \"Commercial / P&L exposure end to end. I\\u2019ve led operations but never owned the full P&L. A rotation or stretch assignment with direct commercial accountability would close this gap. (30 words)\" },\n    { q: \"Career aspirations (200 words max)\",        a: \"I want to build a career that combines operations depth with commercial breadth. In the next 2\\u20133 years, a role where I\\u2019m accountable for both how we run and how we sell \\u2014 ideally in a different business unit to broaden exposure. Longer term, a general management role in the region. I\\u2019m not in a rush \\u2014 doing the next role well matters more than moving fast.\" }\n  ];\n\n  const EXAMPLE_WEAK = [\n    { q: \"Preferred future career direction\",         a: \"Open to whatever opportunities come up.\" },\n    { q: \"Standout achievement (50 words max)\",       a: \"Delivered a lot of great work across the year and built strong relationships with the team and wider stakeholders.\" },\n    { q: \"Key development priority (50 words max)\",   a: \"Keep developing my leadership and communication skills.\" },\n    { q: \"Career aspirations (200 words max)\",        a: \"I\\u2019m happy where I am and open to whatever the business needs. I\\u2019d like to keep growing.\" }\n  ];\n\n  const TIMELINE = [\n    { when: \"May\",                what: \"Workshops, guides and the toolkit go live to help you and your manager prepare\" },\n    { when: \"1\\u201330 June\",    what: \"You share your career aspirations and development areas\", you: true },\n    { when: \"1\\u201324 July\",    what: \"Your manager reflects on your input and adds their view\" },\n    { when: \"End of July\",        what: \"You have a combined mid-year, IDP and career conversation with your manager\", you: true },\n    { when: \"August\",             what: \"Your Head of People and manager calibrate development plans across the region\" },\n    { when: \"September\",          what: \"ExCo Talent Coordinating Committee reviews talent and development across Holcim\" },\n    { when: \"Ongoing\",            what: \"Your development actions stay live through one-to-ones, with ExCo holding the organisation accountable\" }\n  ];\n\n  const FAQS = [\n    { q: \"Is this a performance review?\", a: \"No. This is about your career \\u2014 where you want to go, what would help you get there, and what support you\\u2019d like. Performance and pay are separate processes.\", tag: \"Common\" },\n    { q: \"What if I want to stay in my role, or move sideways rather than up?\", a: \"That\\u2019s more than okay. This process is for everyone in scope \\u2014 not just people who want multi-layer promotions. Lateral moves, deepening in your current role, or wanting to stay put are all valid. The point is that we hear what you actually want.\", tag: \"Common\" },\n    { q: \"Why are some of my peers not being asked?\", a: \"Scope is defined by role, not by person \\u2014 this cycle is focused on colleagues in P&L roles and in feeder roles that lead into P&L positions. Career growth into P&L is critical for this business, which is why we\\u2019re starting the conversations here. It will roll out to other roles over time. Being in scope reflects the role, not a judgement on anyone who isn\\u2019t.\", tag: \"Scope\" },\n    { q: \"Will this affect my pay or my next promotion?\", a: \"Not directly. This process is not used to make pay or promotion decisions \\u2014 those run separately. What this informs is how we plan development, career moves and support over time.\", tag: \"Common\" },\n    { q: \"What if I don\\u2019t trust this \\u2014 we\\u2019ve had processes before that went nowhere.\", a: \"Fair. The payback for you is a proper development conversation with your manager and a specific action that will actually happen. If that doesn\\u2019t land, the process has failed you \\u2014 and you should say so. ExCo are tracking development commitments monthly so this produces a real outcome, not a form that disappears.\", tag: \"Trust\" },\n    { q: \"What happens with what I share?\", a: \"The Talent team holds your input centrally. Your line manager reads it to inform the development conversation with you. A small group \\u2014 your Head of People and the Head of Talent \\u2014 look across submissions regionally to help plan support and development. It is not shared more widely.\", tag: \"Data\" },\n    { q: \"What if I disagree with something my manager says in our conversation?\", a: \"Say so. The development conversation is meant to be a dialogue. If something doesn\\u2019t match your experience or what you\\u2019ve shared, raise it. Your Head of People is also available if the conversation doesn\\u2019t feel right.\", tag: \"Common\" }\n  ];\n\n  // ─── Tiny DOM helpers ──────────────────────────────────────────────\n  function el(tag, attrs, children) {\n    const n = document.createElement(tag);\n    if (attrs) Object.keys(attrs).forEach(k => {\n      if (k === \"class\") n.className = attrs[k];\n      else if (k === \"html\") n.innerHTML = attrs[k];\n      else n.setAttribute(k, attrs[k]);\n    });\n    (children || []).forEach(c => { if (c != null) n.appendChild(typeof c === \"string\" ? document.createTextNode(c) : c); });\n    return n;\n  }\n  function esc(s) { return String(s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#39;\"}[c])); }\n\n  // ─── Render form sections ─────────────────────────────────────────\n  (function renderForm() {\n    const root = document.getElementById(\"form-sections\");\n    FORM_SECTIONS.forEach((s, i) => {\n      root.insertAdjacentHTML(\"beforeend\",\n        '<div class=\"form-card\">' +\n          '<div class=\"form-card__head\">' +\n            '<div class=\"form-card__num\">' + (i + 1) + '<\u002Fdiv>' +\n            '<div class=\"form-card__title\">' + esc(s.title) + '<\u002Fdiv>' +\n          '<\u002Fdiv>' +\n          '<div class=\"form-card__body\">' + esc(s.body) + '<\u002Fdiv>' +\n        '<\u002Fdiv>'\n      );\n    });\n  })();\n\n  // ─── Render tips ──────────────────────────────────────────────────\n  (function renderTips() {\n    const root = document.getElementById(\"tips\");\n    TIPS.forEach((t, i) => {\n      root.insertAdjacentHTML(\"beforeend\",\n        '<div class=\"tip\">' +\n          '<div class=\"tip__head\">' +\n            '<div class=\"tip__num\">' + (i + 1) + '<\u002Fdiv>' +\n            '<div class=\"tip__title\">' + esc(t.title) + '<\u002Fdiv>' +\n          '<\u002Fdiv>' +\n          '<div class=\"tip__grid\">' +\n            '<div class=\"tip__good\"><div class=\"tip__label\">\\u2713 Try<\u002Fdiv>' + esc(t.good) + '<\u002Fdiv>' +\n            '<div class=\"tip__bad\"><div class=\"tip__label\">\\u2717 Avoid<\u002Fdiv>' + esc(t.bad) + '<\u002Fdiv>' +\n          '<\u002Fdiv>' +\n        '<\u002Fdiv>'\n      );\n    });\n  })();\n\n  // ─── Example toggle ───────────────────────────────────────────────\n  (function renderExample() {\n    const root = document.getElementById(\"example-items\");\n    const btnGood = document.getElementById(\"ex-btn-good\");\n    const btnBad = document.getElementById(\"ex-btn-bad\");\n\n    function paint(kind) {\n      const items = kind === \"good\" ? EXAMPLE_GOOD : EXAMPLE_WEAK;\n      const color = kind === \"good\" ? \"var(--green)\" : \"var(--red)\";\n      root.innerHTML = \"\";\n      items.forEach((it, i) => {\n        root.insertAdjacentHTML(\"beforeend\",\n          '<div class=\"ex-item\">' +\n            '<div class=\"ex-item__q-label\" style=\"color:' + color + '\">Q' + (i + 1) + '<\u002Fdiv>' +\n            '<div class=\"ex-item__q\">' + esc(it.q) + '<\u002Fdiv>' +\n            '<div class=\"ex-item__a\">' + esc(it.a) + '<\u002Fdiv>' +\n          '<\u002Fdiv>'\n        );\n      });\n      btnGood.classList.toggle(\"is-active\", kind === \"good\");\n      btnBad.classList.toggle(\"is-active\", kind === \"bad\");\n    }\n\n    btnGood.addEventListener(\"click\", function () { paint(\"good\"); });\n    btnBad.addEventListener(\"click\", function () { paint(\"bad\"); });\n    paint(\"good\");\n  })();\n\n  // ─── Timeline ─────────────────────────────────────────────────────\n  (function renderTimeline() {\n    const root = document.getElementById(\"timeline\");\n    TIMELINE.forEach(t => {\n      root.insertAdjacentHTML(\"beforeend\",\n        '<div class=\"tl-row' + (t.you ? ' tl--you' : '') + '\">' +\n          '<div class=\"tl-row__when\">' + esc(t.when) + '<\u002Fdiv>' +\n          '<div class=\"tl-row__dot\"><\u002Fdiv>' +\n          '<div class=\"tl-row__what\">' + esc(t.what) +\n            (t.you ? '<span class=\"tl-row__pill\">You<\u002Fspan>' : '') +\n          '<\u002Fdiv>' +\n        '<\u002Fdiv>'\n      );\n    });\n  })();\n\n  // ─── FAQs (accordion) ─────────────────────────────────────────────\n  (function renderFaqs() {\n    const root = document.getElementById(\"faqs\");\n    FAQS.forEach((f, i) => {\n      const node = document.createElement(\"div\");\n      node.className = \"faq\" + (i === 0 ? \" is-open\" : \"\");\n      node.innerHTML =\n        '<button class=\"faq__btn\" aria-expanded=\"' + (i === 0) + '\">' +\n          '<div class=\"faq__row\">' +\n            '<span class=\"faq__q\">' + esc(f.q) + '<\u002Fspan>' +\n          '<\u002Fdiv>' +\n          '<span class=\"faq__plus\">+<\u002Fspan>' +\n        '<\u002Fbutton>' +\n        '<div class=\"faq__a\">' + esc(f.a) + '<\u002Fdiv>';\n\n      node.querySelector(\".faq__btn\").addEventListener(\"click\", function () {\n        const open = node.classList.toggle(\"is-open\");\n        this.setAttribute(\"aria-expanded\", open);\n      });\n      root.appendChild(node);\n    });\n  })();\n\n  // ─── Sticky nav active highlight (scrollspy) ──────────────────────\n  (function scrollspy() {\n    const links = Array.prototype.slice.call(document.querySelectorAll('.nav__link'));\n    const map = {};\n    links.forEach(l => { map[l.getAttribute('href').slice(1)] = l; });\n\n    const obs = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting) {\n          links.forEach(l => l.classList.remove('is-active'));\n          if (map[e.target.id]) map[e.target.id].classList.add('is-active');\n        }\n      });\n    }, { threshold: 0.3 });\n\n    document.querySelectorAll('main section[id]').forEach(s => obs.observe(s));\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
